repos:
  - repo: local
    hooks:
      - id: dotnet-tool-restore
        name: Install .NET tools
        entry: dotnet tool restore
        language: system
        always_run: true
        pass_filenames: false
        stages:
          - pre-commit
          - pre-push
          - post-checkout
          - post-rewrite
        description: Install the .NET tools listed at .config/dotnet-tools.json.
      - id: csharpier
        name: Run CSharpier on C# files
        entry: dotnet tool run Csharpier format
        language: system
        types:
          - c#
        description: CSharpier is an opinionated C# formatter inspired by Prettier.
      - id: lint-llm-instructions
        name: Lint the .llm agent harness
        entry: pwsh -NoProfile -File scripts/lint-llm-instructions.ps1
        language: system
        pass_filenames: false
        files: ^(\.llm/|scripts/|AGENTS\.md$|CLAUDE\.md$|GEMINI\.md$|\.cursorrules$|\.windsurfrules$|\.github/copilot-instructions\.md$)
        description: Validates SKILL.md frontmatter, index freshness, entrypoint delegation, and version sync. Auto-fixes with the fix script below on the next run.
      - id: lint-file-lengths
        name: Enforce .llm 300-line limit
        entry: pwsh -NoProfile -File scripts/lint-file-lengths.ps1
        language: system
        pass_filenames: false
        files: ^\.llm/.*\.md$
        description: Hard 300-line limit for every markdown file under .llm (excluding the generated index).
# Documentation site configuration. The site is built into site/, which is
# gitignored and excluded from the UPM and npm package payloads.
site_name: DxVisualizer
site_description: Your game data, one window. Find, inspect, organize, and edit ScriptableObject data in one Unity editor window.
site_url: https://wallstop.github.io/DataVisualizer/
repo_url: https://github.com/wallstop/DataVisualizer
repo_name: wallstop/DataVisualizer
edit_uri: edit/main/docs/
copyright: DxVisualizer · Wallstop Studios · Ambiguous Interactive

docs_dir: docs
site_dir: site
strict: true

# admonition backs the `!!! note` callouts; attr_list and md_in_html back the
# homepage buttons; pymdownx.* give fenced code highlighting and copy buttons.
# tables and toc are MkDocs defaults.
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

# The captures under docs/images are generated by the Tests/Editor
# DocsImageCapture driver and were produced and pixel-verified on Windows
# 6000.5 (issue #114), so they ship with the site. Unity's .meta companions
# are importer bookkeeping and must not be published either. overrides/ holds
# theme templates, which Material reads through custom_dir.
exclude_docs: |
  *.meta
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  logo: images/dxvisualizer-mark.svg
  favicon: images/favicon-32.png
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    # Dark first: the Dx family default.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Light: Press paper.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wallstop/DataVisualizer
      name: DxVisualizer on GitHub

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Search and filtering: search-and-filter.md
      - Managing assets: managing-assets.md
      - Organizing your data: organizing.md
  - Extending: extending.md
  - Troubleshooting: troubleshooting.md
  - Migration: migration.md
  - Roadmap: roadmap.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn

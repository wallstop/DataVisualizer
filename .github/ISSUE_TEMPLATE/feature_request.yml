name: Feature request
description: Suggest a Data Visualizer capability or improvement
title: "[Feature]: "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Describe the user problem first so alternatives can be evaluated fairly.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and who benefits?
      placeholder: Describe the workflow, limitation, and impact.
    validations:
      required: true

  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: Describe the observable outcome rather than only an implementation.
      placeholder: Data Visualizer should ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: What do you do today, and why is it insufficient?

  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      description: Maintainers may adjust this classification during triage.
      options:
        - "P1 - blocks an important workflow with no practical alternative"
        - "P2 - materially improves a common workflow"
        - "P3 - useful improvement or specialized workflow"
      default: 2
    validations:
      required: true

  - type: input
    id: unity-version
    attributes:
      label: Unity version
      description: If compatibility matters, provide the full editor version.
      placeholder: 6000.4.6f1

  - type: input
    id: package-version
    attributes:
      label: Data Visualizer version or revision
      placeholder: 0.0.37 or b9266ec

  - type: checkboxes
    id: scope
    attributes:
      label: Affected areas
      options:
        - label: Asset browsing or search
        - label: Asset creation, editing, or lifecycle
        - label: Layout or accessibility
        - label: Persistence or settings
        - label: Public API or automation
        - label: Performance
        - label: Packaging or installation
        - label: Other

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add mockups, examples, related issues, or implementation constraints.

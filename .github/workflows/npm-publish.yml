name: Publish to NPM

# Tag-driven publishing: pushing an annotated vX.Y.Z tag (the release-tag
# workflow's output) publishes that exact tag's package with npm Trusted
# Publishing through GitHub OIDC. A manual dispatch supports reruns of a
# partially completed release; the publish step skips a version already on the
# registry. NOTE: a default GITHUB_TOKEN tag push cannot trigger this workflow,
# so the release-tag workflow must push with RELEASE_TOKEN (see #109).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v0.0.38 (required)"
        type: string
        required: true

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing through OIDC
    steps:
      - name: Resolve the release tag
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          TAG_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "push" ]; then
            tag="${TAG_REF#refs/tags/}"
          else
            tag="${INPUT_TAG}"
          fi
          if ! printf '%s' "${tag}" | grep -qE '^v[0-9]'; then
            echo "::error::'${tag}' is not a release tag; publishing requires a vX.Y.Z tag."
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout the exact release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.resolve.outputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Run non-Unity repository validation
        run: npm run lint:llm

      - name: Verify the release tag and packed payload
        id: verify
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          output="$(node scripts/release/verify-release.mjs --tag "${TAG}")"
          printf '%s\n' "${output}"
          for key in pkg version npm_tag package_file entries; do
            value="$(printf '%s\n' "${output}" | sed -n "s/^${key}: //p")"
            if [ -z "${value}" ]; then
              echo "::error::The verification script did not report '${key}'."
              exit 1
            fi
            echo "${key}=${value}" >> "${GITHUB_OUTPUT}"
          done

      - name: Verify npm trusted publishing toolchain
        run: |
          set -euo pipefail
          node --version
          npm --version
          required_npm="11.5.1"
          current_npm="$(npm --version)"
          if [ "$(printf '%s\n' "${required_npm}" "${current_npm}" | sort -V | head -n1)" != "${required_npm}" ]; then
            echo "::error::npm ${current_npm} is too old; trusted publishing requires npm >= ${required_npm}."
            exit 1
          fi

      - name: Publish to npm with trusted publishing
        env:
          PKG: ${{ steps.verify.outputs.pkg }}
          VER: ${{ steps.verify.outputs.version }}
          NPM_TAG: ${{ steps.verify.outputs.npm_tag }}
          PACKAGE_FILE: ${{ steps.verify.outputs.package_file }}
        run: |
          set -euo pipefail
          # Re-runnable: skip if this exact name@version is already on the registry (a prior
          # run may have published it before failing downstream). npm publish is otherwise
          # irreversible.
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "::notice::${PKG}@${VER} is already on the registry; skipping publish."
          else
            npm publish "${PACKAGE_FILE}" --access public --tag "${NPM_TAG}"
            echo "::notice::Published ${PKG}@${VER} to dist-tag '${NPM_TAG}'."
          fi

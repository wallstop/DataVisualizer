name: Release

# Prepare, validate, merge, and publish in one run. Token-authored merges do
# not start workflows, so publication consumes the explicit merge output.
on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      operation:
        description: "Prepare and release automatically, or resume publication"
        type: choice
        options: [prepare, publish]
        default: prepare
      bump:
        description: "Semantic version bump for preparation"
        type: choice
        options: [patch, minor, major]
        default: patch
      explicit_version:
        description: "Explicit version for preparation (overrides bump)"
        type: string
        default: ""
      tag:
        description: "Existing vX.Y.Z tag (blank uses the current package version)"
        type: string
        default: ""
      dry_run:
        description: "Validate without pushing, opening a PR, or publishing"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the release branch
      pull-requests: write # open the release pull request
      actions: write # dispatch release-branch CI
    outputs:
      version: ${{ steps.prep.outputs.version }}
      branch: ${{ steps.prep.outputs.branch }}
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Credentials must persist: the push step relies on the stored token, and a
          # dropped credential would make the release-branch push fail. The runner is
          # ephemeral, so the stored token does not outlive the job.
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Require the default branch
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: uv run --no-project scripts/release/workflow.py require-main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check npm provenance identity
        env:
          REPOSITORY: ${{ github.repository }}
        run: uv run --no-project scripts/release/repository_identity.py --repository "${REPOSITORY}"

      - name: Bump version and rotate the changelog
        id: prep
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.explicit_version }}
        run: uv run --no-project scripts/release/workflow.py prepare

      - name: Validate the release tree
        run: uv run --no-project scripts/release/workflow.py validate-tree

      - name: Commit and push the release branch
        id: candidate
        if: ${{ inputs.dry_run == false }}
        env:
          BRANCH: ${{ steps.prep.outputs.branch }}
          PREVIOUS_VERSION: ${{ steps.prep.outputs.previous_version }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: uv run --no-project scripts/release/workflow.py commit-push

      - name: Open the release pull request
        if: ${{ inputs.dry_run == false }}
        env:
          BRANCH: ${{ steps.prep.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_VERSION: ${{ steps.prep.outputs.previous_version }}
          VERSION: ${{ steps.prep.outputs.version }}
        run: uv run --no-project scripts/release/workflow.py open-pr

      - name: Validate and merge the release pull request
        id: merge
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.prep.outputs.branch }}
          CANDIDATE_HEAD: ${{ steps.candidate.outputs.head }}
          REQUEST: release-${{ github.run_id }}-${{ github.run_attempt }}
        run: uv run --no-project scripts/release/complete_release_pr.py --branch "${BRANCH}" --request "${REQUEST}" --head "${CANDIDATE_HEAD}"

      - name: Dry-run summary
        if: ${{ inputs.dry_run == true }}
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          BRANCH: ${{ steps.prep.outputs.branch }}
        run: uv run --no-project scripts/release/workflow.py dry-summary

  release:
    name: Tag and publish release
    needs: prepare
    if: >-
      always() && !cancelled() && (
      (needs.prepare.result == 'success' && needs.prepare.outputs.merge_sha != '') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish') ||
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'release/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the annotated tag and GitHub Release
      id-token: write # npm Trusted Publishing
    steps:
      # Keep current workflow tooling when recovering an older immutable tag.
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Retain release tooling
        run: uv run --no-project scripts/release/workflow.py retain-tools

      - name: Resolve the release source
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PREPARED_SHA: ${{ needs.prepare.outputs.merge_sha }}
          PREPARED_BRANCH: ${{ needs.prepare.outputs.branch }}
        run: uv run --no-project scripts/release/workflow.py resolve

      - name: Checkout the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.checkout_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check or repair npm provenance identity
        env:
          REPOSITORY: ${{ github.repository }}
        run: uv run --no-project "${RUNNER_TEMP}/release-tools/repository_identity.py" --root . --repository "${REPOSITORY}" --repair-legacy

      - name: Tag the merged release commit
        if: ${{ steps.resolve.outputs.create_tag == 'true' }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
        run: uv run --no-project "${RUNNER_TEMP}/release-tools/workflow.py" tag

      - name: Run non-Unity repository validation
        run: uv run --no-project scripts/lint_llm_instructions.py

      - name: Verify the release tag and packed payload
        id: verify
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: uv run --no-project "${RUNNER_TEMP}/release-tools/workflow.py" verify

      - name: Verify npm trusted publishing toolchain
        run: uv run --no-project "${RUNNER_TEMP}/release-tools/workflow.py" toolchain

      - name: Build the release .unitypackage
        run: uv run --no-project "${RUNNER_TEMP}/release-tools/workflow.py" build

      - name: Validate the release .unitypackage
        run: uv run --no-project "${RUNNER_TEMP}/release-tools/workflow.py" validate-archive

      - name: Prepare release notes and the npm tarball checksum
        id: artifacts
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.verify.outputs.version }}
          PACKAGE_FILE: ${{ steps.verify.outputs.package_file }}
        run: uv run --no-project "${RUNNER_TEMP}/release-tools/workflow.py" artifacts

      # Every archive and the changelog notes must pass before publication.
      # Reruns finish the GitHub Release when the npm version already exists.
      - name: Publish to npm with trusted publishing
        if: ${{ inputs.dry_run != true }}
        env:
          PKG: ${{ steps.verify.outputs.pkg }}
          VER: ${{ steps.verify.outputs.version }}
          NPM_TAG: ${{ steps.verify.outputs.npm_tag }}
          PACKAGE_FILE: ${{ steps.verify.outputs.package_file }}
        run: uv run --no-project "${RUNNER_TEMP}/release-tools/workflow.py" publish-npm

      - name: Create or update the GitHub Release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          NPM_TAG: ${{ steps.verify.outputs.npm_tag }}
          PACKAGE_FILE: ${{ steps.verify.outputs.package_file }}
        run: uv run --no-project "${RUNNER_TEMP}/release-tools/workflow.py" publish-github

      - name: Upload validated release artifacts
        if: ${{ always() && steps.artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ steps.verify.outputs.version }}
          path: |
            ${{ steps.verify.outputs.package_file }}
            ${{ steps.verify.outputs.package_file }}.sha256
            dist/
          if-no-files-found: error
          retention-days: 14

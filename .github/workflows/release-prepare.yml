name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (choose none when providing an explicit version)"
        type: choice
        required: true
        default: none
        options:
          - none
          - patch
          - minor
          - major
      version:
        description: "Explicit SemVer (leave empty when using a bump)"
        type: string
        required: false
      release_date:
        description: "Release date in YYYY-MM-DD (defaults to today)"
        type: string
        required: false
      dry_run:
        description: "Validate and report without modifying or opening a PR"
        type: boolean
        required: true
        default: false

concurrency:
  group: release-prepare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare versioned release PR
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare release files
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ inputs.release_date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--root .)
          if [ "${BUMP}" != "none" ]; then
            args+=(--bump "${BUMP}")
          elif [ -n "${EXPLICIT_VERSION}" ]; then
            args+=(--version "${EXPLICIT_VERSION}")
          else
            echo "::error::Choose a bump or provide an explicit version."
            exit 1
          fi
          if [ -n "${RELEASE_DATE}" ]; then
            args+=(--date "${RELEASE_DATE}")
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          result="$(python3 scripts/release/release_tools.py prepare "${args[@]}")"
          echo "${result}"
          version="$(printf '%s' "${result}" | jq -r .version)"
          current="$(printf '%s' "${result}" | jq -r .current)"
          {
            echo "version=${version}"
            echo "current=${current}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate prepared release tree
        if: ${{ inputs.dry_run == false }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release/release_tools.py validate-release --root . --version "${VERSION}"
          npm pack --dry-run >/dev/null
          git diff --check

      - name: Create narrowly scoped GitHub App token
        if: ${{ inputs.dry_run == false }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTO_COMMIT_APP_ID }}
          private-key: ${{ secrets.AUTO_COMMIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: DataVisualizer
          permission-contents: write
          permission-pull-requests: write

      - name: Commit and open release PR
        if: ${{ inputs.dry_run == false }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.release.outputs.version }}
          CURRENT: ${{ steps.release.outputs.current }}
        run: |
          set -euo pipefail
          branch="release/v${VERSION}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "::error::Release branch ${branch} already exists; refusing to overwrite it."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .llm/context.md CHANGELOG.md
          git commit -m "Bump version from ${CURRENT} to ${VERSION}"
          remote="https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "${remote}" "HEAD:${branch}"
          export GH_TOKEN="${APP_TOKEN}"
          gh pr create --repo "${GITHUB_REPOSITORY}" --head "${branch}" --base main \
            --title "Bump version from ${CURRENT} to ${VERSION}" \
            --body "Automated release preparation for ${VERSION}. The tag workflow will validate and create v${VERSION} after this PR is merged."

name: LLM Instructions Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".llm/**"
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".cursorrules"
      - ".windsurfrules"
      - ".github/copilot-instructions.md"
      - ".github/workflows/llm-lint.yml"
      - ".pre-commit-config.yaml"
      - ".editorconfig"
      - ".gitattributes"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".csharpierrc"
      - "**/*.md"
      - ".devcontainer/**"
      - ".mcp.json"
      - ".env.local.example"
      - "Editor/**/*.cs"
      - "Runtime/**/*.cs"
      - "Tests/**/*.cs"
      - "Generator~/**/*.cs"
      - "**/*.asmdef"
      - "**/*.ruleset"
      - "**/*.rsp"
  pull_request:
    paths:
      - ".llm/**"
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".cursorrules"
      - ".windsurfrules"
      - ".github/copilot-instructions.md"
      - ".github/workflows/llm-lint.yml"
      - ".pre-commit-config.yaml"
      - ".editorconfig"
      - ".gitattributes"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".csharpierrc"
      - "**/*.md"
      - ".devcontainer/**"
      - ".mcp.json"
      - ".env.local.example"
      - "Editor/**/*.cs"
      - "Runtime/**/*.cs"
      - "Tests/**/*.cs"
      - "Generator~/**/*.cs"
      - "**/*.asmdef"
      - "**/*.ruleset"
      - "**/*.rsp"

concurrency:
  group: llm-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint .llm harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Dual-OS on purpose: catches cross-platform drift in the generated
        # index (line endings, encodings, path separators).
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The lint job only installs prettier; caching the npm download skips
      # most of the install on every run on both operating systems. The lock
      # file is intentionally ignored, so the key hashes package.json.
      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Check Markdown formatting
        run: npm run format:md:check

      - name: Lint LLM instructions
        run: pwsh -NoProfile -File scripts/lint-llm-instructions.ps1 -VerboseOutput

      - name: Enforce C# member ordering
        run: node scripts/lint-csharp-member-order.js --verbose

      - name: Enforce explicit null assertions
        run: node scripts/lint-csharp-null-assertions.js --verbose

      - name: Enforce namespace-scoped usings
        run: node scripts/lint-csharp-usings.js --verbose

      - name: Enforce the release credential contract
        run: node scripts/lint-release-secrets.js --verbose

      - name: Enforce the line-ending contract
        run: node scripts/lint-line-endings.js --verbose

      - name: Enforce the changelog entry length cap
        run: node scripts/lint-changelog-length.js --verbose

      - name: Enforce assembly warning policy
        run: pwsh -NoProfile -File scripts/lint-assembly-warnings.ps1

      - name: Resolve the harness self-test scope
        id: self-test-scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "${BASE_SHA}" || true
          fi
          verdict="$(pwsh -NoProfile -File scripts/should-run-self-tests.ps1 -BaseSha "${BASE_SHA:-}")"
          echo "self-tests=${verdict}" >> "${GITHUB_OUTPUT}"

      # The self-tests only verify the harness surface (scripts, .llm, CI and
      # devcontainer wiring, package manifests). Skip them when that surface
      # is untouched; every surface change still runs the full suite on both
      # operating systems.
      - name: Run harness self-tests
        if: steps.self-test-scope.outputs.self-tests != 'skip'
        run: pwsh -NoProfile -File scripts/tests/run-all.ps1

      - name: Enforce .llm file length limit
        run: pwsh -NoProfile -File scripts/lint-file-lengths.ps1 -VerboseOutput

      - name: Fail on skills index drift
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/generate-skills-index.ps1
          $status = git status --porcelain -- .llm/skills/index.md
          if ($status) {
            Write-Host "::error::.llm/skills/index.md is stale; run scripts/generate-skills-index.ps1 and commit the result."
            Write-Host $status
            exit 1
          }

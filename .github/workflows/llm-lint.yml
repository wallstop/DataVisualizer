name: LLM Instructions Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".llm/**"
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".cursorrules"
      - ".windsurfrules"
      - ".github/copilot-instructions.md"
      - ".github/workflows/llm-lint.yml"
      - ".pre-commit-config.yaml"
      - ".editorconfig"
      - ".gitattributes"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".csharpierrc"
      - "**/*.md"
      - ".devcontainer/**"
      - ".mcp.json"
      - ".env.local.example"
      - "Editor/**/*.cs"
      - "Runtime/**/*.cs"
      - "Tests/**/*.cs"
      - "Generator~/**/*.cs"
      - "**/*.asmdef"
      - "**/*.ruleset"
      - "**/*.rsp"
  pull_request:
    paths:
      - ".llm/**"
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".cursorrules"
      - ".windsurfrules"
      - ".github/copilot-instructions.md"
      - ".github/workflows/llm-lint.yml"
      - ".pre-commit-config.yaml"
      - ".editorconfig"
      - ".gitattributes"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".csharpierrc"
      - "**/*.md"
      - ".devcontainer/**"
      - ".mcp.json"
      - ".env.local.example"
      - "Editor/**/*.cs"
      - "Runtime/**/*.cs"
      - "Tests/**/*.cs"
      - "Generator~/**/*.cs"
      - "**/*.asmdef"
      - "**/*.ruleset"
      - "**/*.rsp"

concurrency:
  group: llm-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint .llm harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Dual-OS on purpose: catches cross-platform drift in the generated
        # index (line endings, encodings, path separators).
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Shallow by default: the scope step fetches a missing base commit
          # itself, so a full history clone only spends runner time.
          fetch-depth: 1

      # One step resolves the interpreter and classifies the change for the
      # two expensible phases: which self-tests to run, and whether the npm
      # install and the Prettier check can be affected at all. Both verdicts
      # fail safe: an unresolvable base runs everything it guarded.
      #
      # Resolution validates that the interpreter actually executes: the
      # Windows python3 App-Execution-Alias stub exists on PATH but is not a
      # working interpreter, and silently falling back to a garbage verdict
      # would turn every Windows run into the full suite. The two concerns
      # share one step because every GitHub step pays runner shell and
      # action overhead on both operating systems, and the scope step is the
      # first consumer of the interpreter it resolves.
      - name: Resolve the interpreter and the check scope
        id: check-scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          PYTHON=""
          for candidate in python3 python; do
            if command -v "${candidate}" >/dev/null 2>&1 && "${candidate}" -c "" 2>/dev/null; then
              PYTHON="${candidate}"
              break
            fi
          done
          if [ -z "${PYTHON}" ]; then
            echo "::error::no working Python 3 interpreter found"
            exit 1
          fi
          echo "PYTHON=${PYTHON}" >> "${GITHUB_ENV}"
          if [ -n "${BASE_SHA:-}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "${BASE_SHA}" || true
          fi
          # The verdict script is stdlib-only typed Python (issue #171). One
          # call prints all three fail-safe key=value verdicts; Prettier reads
          # the checked Markdown files, its config/ignore, and its pinned
          # version, so a diff that touches none of them cannot change that
          # verdict and the npm steps are skipped. An unresolvable base runs
          # everything it guards.
          "${PYTHON}" scripts/should_run_self_tests.py --base-sha "${BASE_SHA:-}" --ci-verdicts >> "${GITHUB_OUTPUT}"

      # The lint job only installs prettier; caching the npm download skips
      # most of the install on every run on both operating systems. The lock
      # file is intentionally ignored, so the key hashes package.json.
      - name: Cache npm packages
        if: steps.check-scope.outputs.markdown != 'skip'
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install npm dependencies
        if: steps.check-scope.outputs.markdown != 'skip'
        run: npm install --no-audit --no-fund

      - name: Check Markdown formatting
        if: steps.check-scope.outputs.markdown != 'skip'
        run: npm run format:md:check

      # One Python process runs the same ordered lints and index drift check.
      # Each script keeps its CLI arguments, diagnostics and first-failure exit.
      - name: Run the repository lints
        shell: bash
        run: '"${PYTHON}" scripts/run_ci_lints.py'

      # The self-tests only verify the harness surface (scripts, .llm, CI and
      # devcontainer wiring, package manifests). Skip them when that surface is
      # untouched; otherwise run the same scoped selection the local fast check
      # runs. The selection fails safe: unmapped or shared surface paths resolve
      # to 'all', which runs the full suite.
      - name: Run harness self-tests
        if: steps.check-scope.outputs.self-tests != 'skip'
        shell: bash
        run: |
          selection="${{ steps.check-scope.outputs.selection }}"
          if [ "${selection}" = "all" ] || [ -z "${selection}" ]; then
            "${PYTHON}" scripts/tests/run_all.py
          else
            "${PYTHON}" scripts/tests/run_all.py --names "${selection}"
          fi

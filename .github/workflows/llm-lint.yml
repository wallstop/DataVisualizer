name: LLM Instructions Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".llm/**"
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".cursorrules"
      - ".windsurfrules"
      - ".github/copilot-instructions.md"
      - ".github/workflows/llm-lint.yml"
      - ".pre-commit-config.yaml"
      - ".editorconfig"
      - ".gitattributes"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".csharpierrc"
      - "**/*.md"
      - ".devcontainer/**"
      - "Editor/**/*.cs"
      - "Runtime/**/*.cs"
      - "Tests/**/*.cs"
      - "Generator~/**/*.cs"
      - "**/*.asmdef"
      - "**/*.ruleset"
      - "**/*.rsp"
  pull_request:
    paths:
      - ".llm/**"
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".cursorrules"
      - ".windsurfrules"
      - ".github/copilot-instructions.md"
      - ".github/workflows/llm-lint.yml"
      - ".pre-commit-config.yaml"
      - ".editorconfig"
      - ".gitattributes"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".csharpierrc"
      - "**/*.md"
      - ".devcontainer/**"
      - "Editor/**/*.cs"
      - "Runtime/**/*.cs"
      - "Tests/**/*.cs"
      - "Generator~/**/*.cs"
      - "**/*.asmdef"
      - "**/*.ruleset"
      - "**/*.rsp"

concurrency:
  group: llm-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint .llm harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Dual-OS on purpose: catches cross-platform drift in the generated
        # index (line endings, encodings, path separators).
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Check Markdown formatting
        run: npm run format:md:check

      - name: Lint LLM instructions
        run: pwsh -NoProfile -File scripts/lint-llm-instructions.ps1 -VerboseOutput

      - name: Enforce C# member ordering
        run: node scripts/lint-csharp-member-order.js --verbose

      - name: Enforce explicit null assertions
        run: node scripts/lint-csharp-null-assertions.js --verbose

      - name: Enforce namespace-scoped usings
        run: node scripts/lint-csharp-usings.js --verbose

      - name: Enforce the release credential contract
        run: node scripts/lint-release-secrets.js --verbose

      - name: Enforce the line-ending contract
        run: node scripts/lint-line-endings.js --verbose

      - name: Enforce the changelog entry length cap
        run: node scripts/lint-changelog-length.js --verbose

      - name: Enforce assembly warning policy
        run: pwsh -NoProfile -File scripts/lint-assembly-warnings.ps1

      - name: Run harness self-tests
        run: pwsh -NoProfile -File scripts/tests/run-all.ps1

      - name: Enforce .llm file length limit
        run: pwsh -NoProfile -File scripts/lint-file-lengths.ps1 -VerboseOutput

      - name: Fail on skills index drift
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/generate-skills-index.ps1
          $status = git status --porcelain -- .llm/skills/index.md
          if ($status) {
            Write-Host "::error::.llm/skills/index.md is stale; run scripts/generate-skills-index.ps1 and commit the result."
            Write-Host $status
            exit 1
          }

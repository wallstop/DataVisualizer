name: LLM Instructions Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".llm/**"
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "docs/images/capture-manifest.json"
      - "docs/images/data-visualizer-*.png"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".cursorrules"
      - ".windsurfrules"
      - ".github/copilot-instructions.md"
      - ".github/workflows/llm-lint.yml"
      - ".pre-commit-config.yaml"
      - ".editorconfig"
      - ".gitattributes"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".csharpierrc"
      - "pyproject.toml"
      - "uv.lock"
      - "**/*.md"
      - ".devcontainer/**"
      - ".mcp.json"
      - ".env.local.example"
      - "Editor/**/*.cs"
      - "Runtime/**/*.cs"
      - "Tests/**/*.cs"
      - "Generator~/**/*.cs"
      - "**/*.asmdef"
      - "**/*.ruleset"
      - "**/*.rsp"
  pull_request:
    paths:
      - ".llm/**"
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "docs/images/capture-manifest.json"
      - "docs/images/data-visualizer-*.png"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".cursorrules"
      - ".windsurfrules"
      - ".github/copilot-instructions.md"
      - ".github/workflows/llm-lint.yml"
      - ".pre-commit-config.yaml"
      - ".editorconfig"
      - ".gitattributes"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".csharpierrc"
      - "pyproject.toml"
      - "uv.lock"
      - "**/*.md"
      - ".devcontainer/**"
      - ".mcp.json"
      - ".env.local.example"
      - "Editor/**/*.cs"
      - "Runtime/**/*.cs"
      - "Tests/**/*.cs"
      - "Generator~/**/*.cs"
      - "**/*.asmdef"
      - "**/*.ruleset"
      - "**/*.rsp"

concurrency:
  group: llm-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint .llm harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Dual-OS on purpose: catches cross-platform drift in the generated
        # index (line endings, encodings, path separators).
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Shallow by default: the scope step fetches a missing base commit
          # itself, so a full history clone only spends runner time.
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          enable-cache: false

      # Typed Python owns shallow-base fetching and fail-safe scope outputs.
      - name: Resolve the check scope
        id: check-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run scripts/should_run_self_tests.py --github-actions

      # The lint job only installs prettier. Caching the installed tree lets a
      # package.json hit skip the install entirely — the extraction, not the
      # download, dominates the Windows install — while the npm download cache
      # still covers a changed package.json (an exact-key miss reinstalls over
      # the restored tree). The lock file is intentionally ignored, so both
      # keys hash package.json. The download cache path is per-OS: npm keeps
      # it in ~/.npm on POSIX but in %LocalAppData%\npm-cache on Windows, and
      # a single ~/.npm path never exists there (the save logs "Path
      # Validation Error" and every markdown-surface run pays a cold
      # download).
      - name: Cache npm packages
        if: steps.check-scope.outputs.markdown != 'skip'
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\npm-cache' || '~/.npm' }}
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache the installed toolchain
        if: steps.check-scope.outputs.markdown != 'skip'
        id: toolchain-cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Install npm dependencies
        if: steps.check-scope.outputs.markdown != 'skip' && steps.toolchain-cache.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      - name: Check Markdown formatting
        if: steps.check-scope.outputs.markdown != 'skip'
        run: npm run format:md:check

      # One Python process runs the same ordered lints and index drift check.
      # Each script keeps its CLI arguments, diagnostics and first-failure exit.
      - name: Run the repository lints
        run: uv run scripts/run_ci_lints.py

      # The self-tests only verify the harness surface (scripts, .llm, CI and
      # devcontainer wiring, package manifests). Skip them when that surface is
      # untouched; otherwise run the same scoped selection the local fast check
      # runs. The selection fails safe: unmapped or shared surface paths resolve
      # to 'all', which runs the full suite.
      - name: Run harness self-tests
        if: steps.check-scope.outputs.self-tests != 'skip'
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: uv run scripts/tests/run_all.py --names "${{ steps.check-scope.outputs.selection }}"

name: LLM Instructions Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".llm/**"
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".cursorrules"
      - ".windsurfrules"
      - ".github/copilot-instructions.md"
      - ".github/workflows/llm-lint.yml"
      - ".pre-commit-config.yaml"
      - ".editorconfig"
      - ".gitattributes"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".csharpierrc"
      - "**/*.md"
      - ".devcontainer/**"
      - ".mcp.json"
      - ".env.local.example"
      - "Editor/**/*.cs"
      - "Runtime/**/*.cs"
      - "Tests/**/*.cs"
      - "Generator~/**/*.cs"
      - "**/*.asmdef"
      - "**/*.ruleset"
      - "**/*.rsp"
  pull_request:
    paths:
      - ".llm/**"
      - ".github/workflows/release.yml"
      - "scripts/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "GEMINI.md"
      - ".cursorrules"
      - ".windsurfrules"
      - ".github/copilot-instructions.md"
      - ".github/workflows/llm-lint.yml"
      - ".pre-commit-config.yaml"
      - ".editorconfig"
      - ".gitattributes"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".csharpierrc"
      - "**/*.md"
      - ".devcontainer/**"
      - ".mcp.json"
      - ".env.local.example"
      - "Editor/**/*.cs"
      - "Runtime/**/*.cs"
      - "Tests/**/*.cs"
      - "Generator~/**/*.cs"
      - "**/*.asmdef"
      - "**/*.ruleset"
      - "**/*.rsp"

concurrency:
  group: llm-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint .llm harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Dual-OS on purpose: catches cross-platform drift in the generated
        # index (line endings, encodings, path separators).
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Shallow by default: the scope step fetches a missing base commit
          # itself, so a full history clone only spends runner time.
          fetch-depth: 1

      # The lints and the self-test scope run through the system Python
      # (issue #171). Resolution validates that the interpreter actually
      # executes: the Windows python3 App-Execution-Alias stub exists on
      # PATH but is not a working interpreter, and silently falling back to
      # a garbage verdict would turn every Windows run into the full suite.
      - name: Resolve the Python interpreter
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=""
          for candidate in python3 python; do
            if command -v "${candidate}" >/dev/null 2>&1 && "${candidate}" -c "" 2>/dev/null; then
              PYTHON="${candidate}"
              break
            fi
          done
          if [ -z "${PYTHON}" ]; then
            echo "::error::no working Python 3 interpreter found"
            exit 1
          fi
          echo "PYTHON=${PYTHON}" >> "${GITHUB_ENV}"

      # The lint job only installs prettier; caching the npm download skips
      # most of the install on every run on both operating systems. The lock
      # file is intentionally ignored, so the key hashes package.json.
      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Check Markdown formatting
        run: npm run format:md:check

      - name: Lint LLM instructions
        shell: bash
        run: ${PYTHON} scripts/lint_llm_instructions.py --verbose-output

      - name: Enforce C# member ordering
        run: node scripts/lint-csharp-member-order.js --verbose

      - name: Enforce explicit null assertions
        run: node scripts/lint-csharp-null-assertions.js --verbose

      - name: Enforce namespace-scoped usings
        run: node scripts/lint-csharp-usings.js --verbose

      - name: Enforce the release credential contract
        run: node scripts/lint-release-secrets.js --verbose

      - name: Enforce the line-ending contract
        run: node scripts/lint-line-endings.js --verbose

      - name: Enforce the changelog entry length cap
        run: node scripts/lint-changelog-length.js --verbose

      - name: Enforce assembly warning policy
        run: pwsh -NoProfile -File scripts/lint-assembly-warnings.ps1

      - name: Resolve the harness self-test scope
        id: self-test-scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ] && [ "${BASE_SHA}" != "0000000000000000000000000000000000000000" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "${BASE_SHA}" || true
          fi
          # The verdict script is stdlib-only typed Python (issue #171).
          verdict="$("${PYTHON}" scripts/should_run_self_tests.py --base-sha "${BASE_SHA:-}")"
          selection="$("${PYTHON}" scripts/should_run_self_tests.py --base-sha "${BASE_SHA:-}" --selection)"
          echo "self-tests=${verdict}" >> "${GITHUB_OUTPUT}"
          echo "selection=${selection}" >> "${GITHUB_OUTPUT}"

      # The self-tests only verify the harness surface (scripts, .llm, CI and
      # devcontainer wiring, package manifests). Skip them when that surface is
      # untouched; otherwise run the same scoped selection the local fast check
      # runs. The selection fails safe: unmapped or shared surface paths resolve
      # to 'all', which runs the full suite.
      - name: Run harness self-tests
        if: steps.self-test-scope.outputs.self-tests != 'skip'
        shell: bash
        run: |
          selection="${{ steps.self-test-scope.outputs.selection }}"
          if [ "${selection}" = "all" ] || [ -z "${selection}" ]; then
            pwsh -NoProfile -File scripts/tests/run-all.ps1
          else
            pwsh -NoProfile -File scripts/tests/run-all.ps1 -Names "${selection}"
          fi

      - name: Enforce .llm file length limit
        shell: bash
        run: ${PYTHON} scripts/lint_file_lengths.py --verbose-output

      - name: Fail on skills index drift
        shell: bash
        run: |
          set -euo pipefail
          ${PYTHON} scripts/generate_skills_index.py
          status="$(git status --porcelain -- .llm/skills/index.md)"
          if [ -n "${status}" ]; then
            echo "::error::.llm/skills/index.md is stale; run uv run scripts/generate_skills_index.py and commit the result."
            echo "${status}"
            exit 1
          fi

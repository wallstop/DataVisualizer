name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/build-docs.ps1"
      - ".github/workflows/docs-pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/build-docs.ps1"
      - ".github/workflows/docs-pages.yml"

# Publication runs to completion instead of being cancelled by a later merge,
# so a half-written deploy never replaces a good site.
concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build the site (strict)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build-docs.ps1

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # Pages is a one-time repository setting that this workflow cannot make.
      # Report it instead of failing the run, so the validated site stays
      # available as a run artifact until an owner enables Pages.
      - name: Detect GitHub Pages
        id: pages
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled for ${{ github.repository }}. Set Settings > Pages > Source to GitHub Actions to publish; this run's artifact holds the validated site."
          fi

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
